name: Swiss Design
version: 1.0.0
description: "A minimal, semantic, retro-print theme for portfolios in grav 2."
author:
  name: sparkedbyideas.eu

dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: loose
  fields:
    # Creating a tab in the admin panel
    tabs:
      type: tabs
      active: 1
      fields:
        settings:
          type: tab
          title: Theme Settings
          fields:
            
            custom_footer:
              type: text
              label: Custom Footer Text
              default: "Minimal CSS, Zero JS."
              help: "Text displayed next to the copyright year."

            accent_color:
              type: colorpicker
              label: Accent Color
              default: "#a84b32"
              help: "Color used for links and active elements."