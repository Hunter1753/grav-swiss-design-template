name: Swiss Design
version: 1.4.0
description: "A clean and simple no js twig theme for Grav 2 inspired by old manuals and the swiss design language."
author:
  name: Hunter1753
  url: https://github.com/Hunter1753

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: pagination }

form:
  validation: loose
  fields:
    # Creating a tab in the admin panel
    tabs:
      type: tabs
      active: 1
      fields:
        settings:
          type: tab
          title: Theme Settings
          fields:
            
            custom_footer:
              type: text
              label: Custom Footer Text
              default: "Minimal CSS, Zero JS."
              help: "Text displayed next to the copyright year."

            accent_color:
              type: colorpicker
              label: Accent Color
              default: "#a84b32"
              help: "Color used for links and active elements."